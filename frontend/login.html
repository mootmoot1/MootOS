<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Unlock MootOS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b10;
      color: #f7f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background:
        radial-gradient(circle at 50% 10%, rgba(111, 76, 255, 0.22), transparent 38rem),
        #090b10;
    }

    .card {
      width: min(100%, 26rem);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      background: rgba(19, 22, 31, 0.94);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.42);
    }

    .mark {
      width: 3.4rem;
      height: 3.4rem;
      display: grid;
      place-items: center;
      margin-bottom: 1.15rem;
      border-radius: 1rem;
      background: linear-gradient(145deg, #8a66ff, #4b38ff);
      font-size: 1.35rem;
      font-weight: 800;
    }

    h1 { margin: 0 0 0.55rem; font-size: 1.7rem; }
    p { margin: 0 0 1.45rem; color: #aeb4c2; line-height: 1.55; }
    label { display: block; margin-bottom: 0.55rem; font-weight: 650; }

    input {
      width: 100%;
      min-height: 3.2rem;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 0.9rem;
      padding: 0 1rem;
      background: #0d1017;
      color: #fff;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #7a5cff;
      box-shadow: 0 0 0 3px rgba(122, 92, 255, 0.22);
    }

    button {
      width: 100%;
      min-height: 3.2rem;
      margin-top: 1rem;
      border: 0;
      border-radius: 0.9rem;
      background: linear-gradient(145deg, #825fff, #533cff);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }

    .error {
      margin: 0.85rem 0 0;
      padding: 0.8rem 0.9rem;
      border-radius: 0.75rem;
      background: rgba(255, 78, 103, 0.12);
      color: #ff9aaa;
      font-size: 0.92rem;
    }

    .fine-print {
      margin: 1rem 0 0;
      font-size: 0.8rem;
      color: #777f90;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">M</div>
    <h1>Unlock MootOS</h1>
    <p>This private password keeps your conversations, memories, and OpenAI usage away from anyone who finds the link.</p>

    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit">Open MootOS</button>
      <div class="error" id="errorMessage" role="alert" hidden></div>
    </form>

    <p class="fine-print">The password is checked by MootOS and is never stored in the browser.</p>
  </main>

  <script>
    const form = document.querySelector("#loginForm");
    const password = document.querySelector("#password");
    const button = document.querySelector("#submitButton");
    const errorMessage = document.querySelector("#errorMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorMessage.hidden = true;
      button.disabled = true;
      button.textContent = "Checking…";

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password.value }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.detail || "Could not sign in");
        }

        const requested = new URLSearchParams(window.location.search).get("next");
        const destination = requested && requested.startsWith("/") && !requested.startsWith("//")
          ? requested
          : "/chat";
        window.location.replace(destination);
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.hidden = false;
        password.select();
      } finally {
        button.disabled = false;
        button.textContent = "Open MootOS";
      }
    });
  </script>
</body>
</html>
